[package]
name = "memory-rs"
version = "0.1.0"
edition = "2021"
description = "Neural memory systems with surprise-based learning and retention gates"
authors = ["Kenneth <kenneth@example.com>"]
license = "MIT OR Apache-2.0"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
tokenizers = "0.21.1"
anyhow = "1.0"
hf-hub = { version = "0.4.2", default-features = false, features = ["rustls-tls", "tokio", "ureq"] }
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "0.8.0", features = ["server", "macros", "transport-io"] }

[dev-dependencies]
tokio-test = "0.4"
