[package]
name = "agent-memory-rs"
version = "0.2.0"
edition = "2021"
description = "Production-ready memory system for AI agents with episodic, semantic, and procedural memory. Auto-consolidation, intelligent decay, and MCP server support."
authors = ["Kenneth <kenneth@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/agent-memory-rs"
keywords = ["ai", "agent", "memory", "llm", "mcp"]
categories = ["science", "algorithms"]

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
tokenizers = "0.21.1"
anyhow = "1.0"
hf-hub = { version = "0.4.2", default-features = false, features = ["rustls-tls", "tokio", "ureq"] }
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "0.8.0", features = ["server", "macros", "transport-io"] }
async-trait = "0.1"
chrono = "0.4.43"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "agent-memory-mcp"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "agent-memory-cli"
path = "src/bin/cli.rs"
